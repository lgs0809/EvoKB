name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/mineru/requirements-test.txt
      - name: Install lightweight PDF test dependencies
        run: python -m pip install -r deploy/mineru/requirements-test.txt
      - name: Verify native PDF tables and parser observation
        run: |
          python scripts/test-mineru-text-tables.py --output parser-test-results/native-text-tables.json
          python scripts/test-mineru-observation.py --output parser-test-results/observation.json
      - name: Preserve component evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-components-${{ github.run_id }}-${{ github.run_attempt }}
          path: parser-test-results/
          if-no-files-found: warn
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Java backend
        run: mvn -f java/pom.xml clean verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low

  release-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Scan tracked files
        run: node scripts/release-hygiene.mjs

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend, parser-components, release-hygiene]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: make compose-config
      - name: Build application image
        run: docker build -f deploy/Dockerfile -t evokb:ci .

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [docker]
    env:
      EKB_POSTGRES_DATABASE: evokb_ci_smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare isolated infrastructure credentials
        run: |
          python3 - <<'PY'
          import pathlib, secrets
          content = pathlib.Path('.env.example').read_text()
          content = content.replace('EKB_POSTGRES_PASSWORD=[REDACTED_SECRET]', 'EKB_POSTGRES_PASSWORD=' + secrets.token_urlsafe(32))
          content = content.replace('EKB_MINIO_ROOT_PASSWORD=[REDACTED_SECRET]', 'EKB_MINIO_ROOT_PASSWORD=' + secrets.token_urlsafe(32))
          target = pathlib.Path('.env.ci.private')
          target.write_text(content)
          target.chmod(0o600)
          PY
      - name: Start isolated PostgreSQL/Milvus deployment
        run: docker compose -p evokb-ci-${{ github.run_id }} --env-file .env.ci.private -f deploy/docker-compose.yml up -d --build
      - name: Wait for application health
        run: curl --retry 36 --retry-delay 5 --retry-all-errors --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser smoke
        working-directory: web
        env:
          EKB_E2E_BASE_URL: http://127.0.0.1:18080
        run: npm run e2e
      - name: Collect isolated deployment diagnostics
        if: always()
        run: python3 scripts/collect-browser-smoke-diagnostics.py --project evokb-ci-${{ github.run_id }} --env-file .env.ci.private --output ci-diagnostics
      - name: Preserve browser and deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/
            ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Tear down isolated deployment
        if: always()
        run: docker compose -p evokb-ci-${{ github.run_id }} --env-file .env.ci.private -f deploy/docker-compose.yml down -v --remove-orphans
