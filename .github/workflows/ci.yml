name: CI

on:
  push:
    branches: [main, public-release]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Java backend
        run: mvn -f java/pom.xml clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan tracked files
        run: node scripts/release-hygiene.mjs

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, release-hygiene]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml config -q
      - name: Build application image
        run: docker build -f deploy/Dockerfile -t evokb:ci .

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      EKB_MYSQL_DATABASE: enterprise_kb_ci_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start isolated deployment
        run: docker compose -p ekb-ci-smoke --env-file .env.example -f deploy/docker-compose.yml up -d --build
      - name: Wait for application health
        run: curl --retry 36 --retry-delay 5 --retry-all-errors --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser smoke
        working-directory: web
        env:
          EKB_E2E_BASE_URL: http://127.0.0.1:18080
        run: npm run e2e
      - name: Tear down isolated deployment
        if: always()
        run: docker compose -p ekb-ci-smoke --env-file .env.example -f deploy/docker-compose.yml down -v --remove-orphans
