server:
  port: ${EKB_SERVER_PORT:18080}
  address: ${EKB_SERVER_HOST:127.0.0.1}
  forward-headers-strategy: ${EKB_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: evokb
  data:
    redis:
      host: ${EKB_REDIS_HOST:127.0.0.1}
      port: ${EKB_REDIS_PORT:16385}
      database: ${EKB_REDIS_DATABASE:0}
      timeout: 5s
  datasource:
    url: ${EKB_JDBC_URL:jdbc:postgresql://127.0.0.1:15465/evokb_target?stringtype=unspecified}
    username: ${EKB_DB_USER:evokb_target}
    password: ${EKB_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${EKB_DB_POOL_SIZE:6}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${EKB_MAX_BATCH_UPLOAD_MIB:4096}MB
      max-request-size: ${EKB_MAX_BATCH_UPLOAD_MIB:4096}MB
  web:
    resources:
      static-locations:
        - "file:${EKB_WEB_DIR:./web/dist}/"
        - "classpath:/static/"
  flyway:
    enabled: true
    baseline-on-migrate: ${EKB_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
  ai:
    mcp:
      server:
        enabled: true
        name: evokb
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        instructions: Search enterprise knowledge with raw evidence and package cited source files.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ekb:
  auth:
    secure-cookie: ${EKB_SESSION_COOKIE_SECURE:false}
  upload:
    max-single-bytes: ${EKB_MAX_UPLOAD_BYTES:536870912}

logging:
  level:
    root: INFO
    cn.lgs.knowledgebase: INFO
