name: enterprise-knowledge-base

services:
  mysql:
    image: mysql:8.4
    container_name: ekb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${EKB_MYSQL_DATABASE:-enterprise_kb}
      MYSQL_USER: ${EKB_MYSQL_USER:-ekb}
      MYSQL_PASSWORD: ${EKB_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EKB_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${EKB_MYSQL_PORT:-23316}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: ekb-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${EKB_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${EKB_MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${EKB_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${EKB_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    container_name: ekb-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${EKB_OPENSEARCH_PORT:-19200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  models:
    build:
      context: ./models
    image: enterprise-knowledge-base:models-cpu
    container_name: ekb-models
    restart: unless-stopped
    environment:
      EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
      RERANK_MODEL: Qwen/Qwen3-Reranker-0.6B
      MODEL_MEMORY_MODE: dual
      MODEL_DEVICE: cpu
      MODEL_DTYPE: bfloat16
      RERANK_MODEL_DTYPE: float32
      HF_HOME: /models
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "6"
    ports:
      - "127.0.0.1:${EKB_MODELS_PORT:-18081}:8000"
    volumes:
      - models-data:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  neo4j:
    image: neo4j:5.26.12-community
    container_name: ekb-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${EKB_NEO4J_AUTH}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${EKB_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${EKB_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  mysql-data:
  minio-data:
  opensearch-data:
  models-data:
  neo4j-data:
