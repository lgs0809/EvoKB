services:
  knowledge-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.java
    image: enterprise-knowledge-base:java-server
    environment:
      EKB_JDBC_URL: jdbc:mysql://mysql:3306/${EKB_MYSQL_DATABASE:-enterprise_kb}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      EKB_MYSQL_USER: ${EKB_MYSQL_USER:-ekb}
      EKB_MYSQL_PASSWORD: ${EKB_MYSQL_PASSWORD}
      EKB_MINIO_ENDPOINT: minio:9000
      EKB_MINIO_PUBLIC_ENDPOINT: ${EKB_MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19000}
      EKB_MINIO_REGION: ${EKB_MINIO_REGION:-us-east-1}
      EKB_MINIO_ACCESS_KEY: ${EKB_MINIO_ROOT_USER}
      EKB_MINIO_SECRET_KEY: ${EKB_MINIO_ROOT_PASSWORD}
      EKB_MINIO_BUCKET: ${EKB_MINIO_BUCKET:-enterprise-kb}
      EKB_OPENSEARCH_URL: http://opensearch:9200
      EKB_RAW_INDEX: ${EKB_RAW_INDEX:-ekb_raw_v1}
      EKB_DERIVED_INDEX: ${EKB_DERIVED_INDEX:-ekb_derived_v1}
      EKB_MODELS_URL: http://models:8000
      EKB_MODELS_API_KEY: ${EKB_MODELS_API_KEY:-}
      EKB_EMBED_MODEL: ${EKB_EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EKB_RERANK_MODEL: ${EKB_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      EKB_EMBED_DIMS: ${EKB_EMBED_DIMS:-1024}
      EKB_MINERU_URL: ${EKB_MINERU_URL:-http://host.docker.internal:8000}
      EKB_ASK_BASE_URL: ${EKB_ASK_BASE_URL:-${EKB_LLM_BASE_URL:-https://api.openai.com}}
      EKB_ASK_API_KEY: ${EKB_ASK_API_KEY:-${EKB_LLM_API_KEY:-}}
      EKB_SMALL_MODEL: ${EKB_SMALL_MODEL:-${EKB_LLM_JUDGE_MODEL:-gpt-5.4-mini}}
      EKB_LARGE_MODEL: ${EKB_LARGE_MODEL:-${EKB_LLM_MODEL:-gpt-5.6-luna}}
      EKB_NEO4J_URL: http://neo4j:7474
      EKB_NEO4J_AUTH: ${EKB_NEO4J_AUTH}
      EKB_SERVER_PORT: 18080
      EKB_WEB_DIR: /app/web
      EKB_SESSION_TTL_HOURS: ${EKB_SESSION_TTL_HOURS:-12}
      EKB_SESSION_COOKIE_SECURE: ${EKB_SESSION_COOKIE_SECURE:-false}
      EKB_TRUST_PROXY_HEADERS: ${EKB_TRUST_PROXY_HEADERS:-false}
      EKB_MAX_UPLOAD_BYTES: ${EKB_MAX_UPLOAD_BYTES:-536870912}
      EKB_MAX_BATCH_UPLOAD_MIB: ${EKB_MAX_BATCH_UPLOAD_MIB:-4096}
      EKB_MAX_BATCH_EXPANDED_MIB: ${EKB_MAX_BATCH_EXPANDED_MIB:-16384}
      EKB_MAX_BATCH_FILES: ${EKB_MAX_BATCH_FILES:-2000}
      EKB_STAGING_ROOT: /var/lib/enterprise-kb/staging
      EKB_RERANK_MAX_CHARS: ${EKB_RERANK_MAX_CHARS:-400}
      EKB_RERANK_MAX_CANDIDATES: ${EKB_RERANK_MAX_CANDIDATES:-20}
      EKB_EMBED_TIMEOUT_SECONDS: ${EKB_EMBED_TIMEOUT_SECONDS:-120}
      EKB_RERANK_TIMEOUT_SECONDS: ${EKB_RERANK_TIMEOUT_SECONDS:-30}
      EKB_DISTILL_EFFECTIVE_HIT_THRESHOLD: ${EKB_DISTILL_EFFECTIVE_HIT_THRESHOLD:-3}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
